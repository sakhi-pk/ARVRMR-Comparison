<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('gl'),renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
var T=0,mode='A',arStarted=false,camOn=false,stream=null;

/* ---------- helpers ---------- */
function mat(c,o){var m=new THREE.MeshStandardMaterial({color:c,roughness:.7});if(o!=null){m.transparent=true;m.opacity=o;}return m;}
function bas(c,o){var m=new THREE.MeshBasicMaterial({color:c});if(o!=null){m.transparent=true;m.opacity=o;}return m;}
function put(o,x,y,z){o.position.set(x||0,y||0,z||0);return o;}
function S(r,m,x,y,z,sx,sy,sz){var o=put(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m),x,y,z);o.scale.set(sx||1,sy||1,sz||1);return o;}
function X(w,h,d,m,x,y,z){return put(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),x,y,z);}
function C(rt,rb,h,m,x,y,z,n){return put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n||10),m),x,y,z);}
function K(r,h,m,x,y,z,n){return put(new THREE.Mesh(new THREE.ConeGeometry(r,h,n||8),m),x,y,z);}
function lights(sc){sc.add(new THREE.HemisphereLight(0xffffff,0x665544,.95));var d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(4,8,5);sc.add(d);}

/* ---------- dragon (built from simple shapes) ---------- */
function makeDragon(){
  var red=mat(0xb3261e),dark=mat(0x6e1410),belly=mat(0xe8b25a),bone=mat(0xf2e6c9),eyeM=bas(0xffe14d),wingM=mat(0x8c1c15);wingM.side=THREE.DoubleSide;
  var g=new THREE.Group(),rig=new THREE.Group();g.add(rig);
  rig.add(S(.5,red,0,.55,0,1,.9,1.8));rig.add(S(.42,belly,0,.42,.05,.9,.7,1.7));
  var neck=[];for(var i=0;i<5;i++){var n=S(.2-i*.012,red,0,.75+i*.1,.8+i*.12);rig.add(n);neck.push(n);}
  var head=new THREE.Group();put(head,0,1.28,1.45);rig.add(head);
  head.add(S(.2,red,0,0,0,1,.9,1.3));head.add(S(.13,red,0,-.04,.3,1,.8,1.5));
  head.add(S(.05,eyeM,.12,.08,.12));head.add(S(.05,eyeM,-.12,.08,.12));
  [-1,1].forEach(function(s){var h=K(.05,.3,bone,s*.1,.22,-.08,8);h.rotation.x=-.6;head.add(h);});
  var mouth=put(new THREE.Object3D(),0,-.05,.55);head.add(mouth);
  for(var k=0;k<7;k++)rig.add(K(.05,.16,bone,0,1.0-k*.02,.55-k*.28,6));
  [[.28,.9],[-.28,.9],[.28,-.7],[-.28,-.7]].forEach(function(p){rig.add(C(.09,.07,.4,dark,p[0],.2,p[1],8));rig.add(S(.11,dark,p[0],.02,p[1]+.05,1,.6,1.4));});
  var tail=[];for(var t=0;t<11;t++){var ts=S(.3-t*.024,red,0,.5,-.9-t*.3);rig.add(ts);tail.push(ts);}
  function wing(side){
    var w=put(new THREE.Group(),side*.35,.95,.15);
    var v=[0,0,0,1.5,.55,-.1,2.4,.15,-.6,2.0,-.25,-1.1,1.0,-.15,-1.0,0,0,-.8],pos=v.slice();
    if(side<0)for(var q=0;q<pos.length;q+=3)pos[q]*=-1;
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex([0,1,2,0,2,3,0,3,4,0,4,5]);geo.computeVertexNormals();
    w.add(new THREE.Mesh(geo,wingM));
    var arm=C(.03,.04,2.4,dark,side*1.2,.2,-.1,6);arm.rotation.z=-side*Math.PI/2+side*.22;w.add(arm);return w;}
  var wl=wing(-1),wr=wing(1);rig.add(wl);rig.add(wr);
  return {g:g,rig:rig,wl:wl,wr:wr,tail:tail,neck:neck,head:head,mouth:mouth};
}
function animD(d,T,f,amp){
  d.wl.rotation.z=-Math.sin(T*f)*amp;d.wr.rotation.z=Math.sin(T*f)*amp;
  d.tail.forEach(function(s,i){s.position.x=Math.sin(T*2.2-i*.55)*.05*(i+1);});
  d.head.rotation.y=Math.sin(T*.9)*.25;d.head.rotation.x=Math.sin(T*1.3)*.06;
}

/* ---------- fire particles ---------- */
function Fire(parent,scale){
  this.t=0;this.i=0;this.s=scale||1;this.p=[];
  var g=new THREE.SphereGeometry(.06,6,5);
  for(var n=0;n<90;n++){var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffcc33,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.visible=false;m.userData={l:0,v:new THREE.Vector3()};parent.add(m);this.p.push(m);}
}
Fire.prototype.start=function(){this.t=1.4;};
Fire.prototype.update=function(dt,d){
  var self=this,tmp=new THREE.Vector3(),dir=new THREE.Vector3();
  if(this.t>0){this.t-=dt;d.g.updateMatrixWorld(true);
    for(var s=0;s<2;s++){var m=this.p[this.i=(this.i+1)%this.p.length];m.parent.worldToLocal(d.mouth.getWorldPosition(m.position));
      dir.set(0,-.12,1).transformDirection(d.head.matrixWorld);
      m.userData.v.copy(dir).multiplyScalar((2.2+Math.random()*1.2)*self.s).add(tmp.set(Math.random()-.5,Math.random()-.4,Math.random()-.5).multiplyScalar(.7*self.s));
      m.userData.l=.9;m.visible=true;}}
  this.p.forEach(function(m){if(!m.visible)return;var u=m.userData;u.l-=dt;if(u.l<=0){m.visible=false;return;}
    m.position.addScaledVector(u.v,dt);u.v.y+=.6*dt;m.scale.setScalar((1+(.9-u.l)*3.2)*self.s);
    m.material.color.setHSL(.02+.1*(u.l/.9),1,.5);m.material.opacity=u.l/.9;});
};

/* ---------- avatar (VR headset or MR glasses) ---------- */
function makeAvatar(kind){
  var skin=mat(0xf0c8a0),shirt=mat(0x1f8a9e),pants=mat(0x2b2f4a),hair=mat(0x2a1a10),g=new THREE.Group();
  g.add(X(.5,.7,.28,shirt,0,1.05,0));
  var head=put(new THREE.Group(),0,1.6,0);g.add(head);head.add(S(.18,skin,0,0,0));head.add(S(.19,hair,0,.04,-.03,1,.8,1));
  function limb(w,h,d,m,x,y){var p=put(new THREE.Group(),x,y,0);p.add(X(w,h,d,m,0,-h/2,0));g.add(p);return p;}
  var legL=limb(.17,.7,.2,pants,-.12,.7),legR=limb(.17,.7,.2,pants,.12,.7),armL=limb(.14,.6,.16,skin,-.33,1.38),armR=limb(.14,.6,.16,skin,.33,1.38);
  var lens=null;
  if(kind==='vr'){
    head.add(X(.42,.22,.26,mat(0x15151f),0,.02,.1));
    head.add(X(.34,.07,.02,bas(0x37e6ff),0,.02,.235));
    var st=new THREE.Mesh(new THREE.TorusGeometry(.2,.02,6,18),mat(0x15151f));st.rotation.x=Math.PI/2;st.position.y=.03;head.add(st);
  }else{
    var fm=mat(0x222a33);lens=new THREE.MeshBasicMaterial({color:0x37e6ff,transparent:true,opacity:.5,side:THREE.DoubleSide});
    [-1,1].forEach(function(s){head.add(put(new THREE.Mesh(new THREE.TorusGeometry(.058,.009,6,18),fm),s*.075,.03,.172));
      head.add(put(new THREE.Mesh(new THREE.CircleGeometry(.056,18),lens),s*.075,.03,.172));
      head.add(X(.01,.01,.18,fm,s*.16,.03,.08));});
    head.add(X(.05,.01,.01,fm,0,.04,.172));
  }
  g.userData={legL:legL,legR:legR,armL:armL,armR:armR,lens:lens,head:head};return g;
}
function walk(a,t,on){var u=a.userData,s=on?Math.sin(t*10)*.7:0;u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s;u.armR.rotation.x=s;}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}

/* ====================== AR : camera + dragon added ====================== */
var AR=new THREE.Scene(),camAR=new THREE.PerspectiveCamera(60,1,.05,50);lights(AR);
var HGT=1.4; /* assumed phone height above the floor, metres */
var drA=makeDragon(),dragA=drA.g;
var shadowA=new THREE.Mesh(new THREE.CircleGeometry(1.3,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));
shadowA.rotation.x=-Math.PI/2;shadowA.position.y=.01;shadowA.scale.set(1,1.6,1);dragA.add(shadowA);
var baseA=.7;dragA.scale.setScalar(baseA);dragA.visible=false;AR.add(dragA);
var fireAR=new Fire(AR,.7),placedA=false,arStartT=-1;
var D2R=Math.PI/180,zee=new THREE.Vector3(0,0,1),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),eu=new THREE.Euler();
var gotO=false,oriBound=false,yawA=0,pitchA=0,fwdA=new THREE.Vector3();
function onOri(e){if(e.alpha==null)return;gotO=true;
  var o=(screen.orientation&&screen.orientation.angle||window.orientation||0)*D2R;
  eu.set(e.beta*D2R,e.alpha*D2R,-e.gamma*D2R,'YXZ');camAR.quaternion.setFromEuler(eu);
  camAR.quaternion.multiply(q1);camAR.quaternion.multiply(q0.setFromAxisAngle(zee,-o));}
function bindOri(){
  if(oriBound)return null;
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    return DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted'){addEventListener('deviceorientation',onOri,true);oriBound=true;}}).catch(function(){});
  }
  addEventListener('deviceorientation',onOri,true);oriBound=true;return null;
}
function placeA(x,z){dragA.position.set(x,-HGT,z);dragA.visible=true;placedA=true;}
function placeAhead(){camAR.getWorldDirection(fwdA);fwdA.y=0;if(fwdA.lengthSq()<1e-4)fwdA.set(0,0,-1);fwdA.normalize();placeA(fwdA.x*3,fwdA.z*3);}
function sizeA(f){baseA=Math.max(.3,Math.min(2.2,baseA*f));dragA.scale.setScalar(baseA);fireAR.s=baseA;}
function updAR(dt,t){
  if(!gotO)camAR.rotation.set(pitchA,yawA,0,'YXZ');
  if(!placedA&&arStarted&&arStartT>=0&&(gotO||t-arStartT>1.2)){if(gotO)placeAhead();else placeA(0,-3);}
  if(placedA){
    dragA.lookAt(camAR.position.x,dragA.position.y,camAR.position.z);
    drA.rig.position.y=Math.sin(t*2)*.03;animD(drA,t,3.2,.5);
  }
  fireAR.update(dt,drA);
}
$('fireA').onclick=function(){fireAR.start();};
$('big').onclick=function(){sizeA(1.2);};
$('small').onclick=function(){sizeA(1/1.2);};

/* ---------- shared camera ---------- */
function startCam(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return Promise.reject(new Error('no camera api'));
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){stream=s;$('cam').srcObject=s;camOn=true;});
}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}$('cam').srcObject=null;camOn=false;}
var CAMERR='Camera blocked or unavailable, so a plain background is shown. Open this page directly in your phone browser (https) and allow the camera.';
$('go').onclick=function(){
  $('err').textContent='';$('msgA').textContent='';
  var tasks=[];
  tasks.push(startCam().catch(function(){$('msgA').textContent=CAMERR;}));
  tasks.push(bindOri());
  Promise.all(tasks).then(function(){arStarted=true;arStartT=T;layout();});
};

var VR=new THREE.Scene(),camVR=new THREE.PerspectiveCamera(60,1,.05,300);lights(VR);

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

if (!window.THREE || !window.gsap || !THREE.OrbitControls) {
  document.body.insertAdjacentHTML('beforeend',
    '<div class="fatal glass">Could not load Three.js / GSAP from the CDN.<br>Check your internet connection and reload.</div>');
  return;
}

/* =====================================================================
   1. RENDERER, SCENE, CAMERA, CONTROLS
   World units: 1 unit ≈ 7 cm, so the ~1.7 unit wide heart ≈ 12 cm (life size).
   ===================================================================== */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.localClippingEnabled = true;          // needed for the cutaway planes

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.02, 80);
camera.position.set(0, 2.7, 5.8);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.9;
controls.screenSpacePanning = true;
controls.minDistance = 0.22;                    // close enough to fly inside a chamber
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.53;        // stay above the floor
controls.target.set(0, 0.3, 0);

scene.add(new THREE.HemisphereLight(0xaab8ee, 0x1a0a12, 0.55));
const key = new THREE.DirectionalLight(0xfff0e6, 1.25); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x6aa8ff, 0.9); rim.position.set(-4, 2.5, -3); scene.add(rim);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   2. TEXTURES + FLOOR GRID
   ===================================================================== */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.22, 'rgba(255,255,255,.65)');
  r.addColorStop(.55, 'rgba(255,255,255,.14)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);

}
const glow = glowTexture();

function gridTexture() {
  const s = 2048, cells = 28, step = s / cells, c = document.createElement('canvas');
  c.width = c.height = s; const g = c.getContext('2d');
  g.strokeStyle = 'rgba(70,190,255,.5)'; g.lineWidth = 2;
  for (let i = 0; i <= cells; i++) {
    const p = i * step;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, s); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(s, p); g.stroke();
  }
  g.strokeStyle = 'rgba(130,225,255,.95)'; g.lineWidth = 3.5;
  for (let i = 0; i <= cells; i += 4) {
    const p = i * step;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, s); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(s, p); g.stroke();
  }
  g.globalCompositeOperation = 'destination-in';           // radial fade-out mask
  const m = g.createRadialGradient(s / 2, s / 2, s * .04, s / 2, s / 2, s / 2);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(.55, 'rgba(0,0,0,.5)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14),
  new THREE.MeshBasicMaterial({ map: gridTexture(), transparent: true, opacity: 0.55, depthWrite: false }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* =====================================================================
   3. SCAN STATE: reticle, ripple, feature points
   ===================================================================== */
const addMat = (color, op) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
const reticle = new THREE.Group(); reticle.position.y = 0.012; scene.add(reticle);
const ringIn = new THREE.Mesh(new THREE.RingGeometry(0.56, 0.585, 96), addMat(0x37e6ff, .9));
ringIn.rotation.x = -Math.PI / 2; reticle.add(ringIn);
const dashes = new THREE.Group(); reticle.add(dashes);
for (let i = 0; i < 28; i++) {
  const a = i / 28 * Math.PI * 2;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.004, 0.026), addMat(0x37e6ff, .85));
  m.position.set(Math.cos(a) * 0.78, 0, Math.sin(a) * 0.78);
  m.rotation.y = -a - Math.PI / 2; dashes.add(m);
}
const cdot = new THREE.Mesh(new THREE.CircleGeometry(0.035, 24), addMat(0x37e6ff, 1));
cdot.rotation.x = -Math.PI / 2; reticle.add(cdot);
const ripple = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 96), addMat(0x37e6ff, .6));
ripple.rotation.x = -Math.PI / 2; reticle.add(ripple);

const FP = 90, fpPos = new Float32Array(FP * 3);
for (let i = 0; i < FP; i++) {
  const r = Math.sqrt(Math.random()) * 2.8, a = Math.random() * Math.PI * 2;
  fpPos.set([Math.cos(a) * r, 0.016, Math.sin(a) * r], i * 3);
}
const fpGeo = new THREE.BufferGeometry();
fpGeo.setAttribute('position', new THREE.BufferAttribute(fpPos, 3));
fpGeo.setDrawRange(0, 0);
const featurePts = new THREE.Points(fpGeo, new THREE.PointsMaterial({
  color: 0x8ff3ff, size: 0.075, map: glow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(featurePts);

/* =====================================================================
   4. ANCHOR + HEART ROOTS (filled in the next section)
   ===================================================================== */
const HEART_Y = 1.38;                       // hover height of the heart centre above the floor
const anchor = new THREE.Group(); scene.add(anchor);          // moves to where the user taps
const heart = new THREE.Group(); heart.visible = false; anchor.add(heart);   // spawn scale / hover
const body = new THREE.Group(); heart.add(body);                              // heartbeat scale

// anchor ring + soft red glow on the floor under the heart
const anchorRing = new THREE.Group(); anchorRing.position.y = 0.014; anchorRing.visible = false; anchor.add(anchorRing);
const aRing = new THREE.Mesh(new THREE.RingGeometry(0.88, 0.915, 96), addMat(0x37e6ff, .85));
aRing.rotation.x = -Math.PI / 2; anchorRing.add(aRing);
const aDash = new THREE.Group(); anchorRing.add(aDash);
for (let i = 0; i < 36; i++) {
  const a = i / 36 * Math.PI * 2;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.004, 0.02), addMat(0x6ff0b0, .8));
  m.position.set(Math.cos(a) * 1.02, 0, Math.sin(a) * 1.02); m.rotation.y = -a - Math.PI / 2; aDash.add(m);
}
const aPulse = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 96), addMat(0x6ff0b0, 0));
aPulse.rotation.x = -Math.PI / 2; anchorRing.add(aPulse);
const floorGlow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2),
  new THREE.MeshBasicMaterial({ map: glow, color: 0xff3d55, transparent: true, opacity: .3, depthWrite: false, blending: THREE.AdditiveBlending }));
floorGlow.rotation.x = -Math.PI / 2; floorGlow.position.y = 0.01; anchorRing.add(floorGlow);

/* pointer → floor ray */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function floorHit(cx, cy) {
  ndc.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObject(floor);
  return h.length ? h[0].point : null;
}
const reticleTarget = new THREE.Vector3(0, 0, 0);
function setReticleTarget(p) {
  const r = Math.hypot(p.x, p.z), k = r > 3.2 ? 3.2 / r : 1;
  reticleTarget.set(p.x * k, 0, p.z * k);
}

/* scan progress (simulated plane detection) */
let state = 'scan', T = 0, scanT = 0, scanFound = false;
const scanMsg = $('scanMsg'), scanBar = $('scanBar');
function updateScan(dt) {
  scanT += dt;
  const prog = clamp(scanT / 2.4, 0, 1);
  scanBar.style.width = (prog * 100).toFixed(0) + '%';
  fpGeo.setDrawRange(0, Math.floor(prog * FP));
  if (!scanFound && prog >= 1) {
    scanFound = true;
    scanMsg.textContent = 'Flat surface found · ' + FP + ' feature points. Tap the surface to place the heart.';
    gsap.fromTo(reticle.scale, { x: 1.18, y: 1.18, z: 1.18 }, { x: 1, y: 1, z: 1, duration: .5, ease: 'back.out(2)' });
  } else if (!scanFound) {
    scanMsg.textContent = 'Move your device slowly to detect a surface… ' + Math.floor(prog * FP) + ' feature points';
  }
  reticle.position.x = lerp(reticle.position.x, reticleTarget.x, 1 - Math.exp(-dt * 10));
  reticle.position.z = lerp(reticle.position.z, reticleTarget.z, 1 - Math.exp(-dt * 10));
  dashes.rotation.y += dt * 0.7;
  const s = (T * 0.55) % 1;
  ripple.scale.setScalar(0.6 + s * 2.6); ripple.material.opacity = 0.55 * (1 - s);
  ringIn.material.opacity = scanFound ? 1 : .6 + .3 * Math.sin(T * 6);
}

/* =====================================================================
   5. PROCEDURAL HEART  (heart-local coords: +x = patient's left, +y up, +z anterior)
   ===================================================================== */
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1);   // keeps z <= constant
const OFF_Z = 1.0, ON_Z = -0.02;
const cut = { z: OFF_Z, on: false };

function noise3(x, y, z) {
  return Math.sin(x * 3.1 + y * 2.3 + z * 1.7) * Math.cos(z * 2.7 + x * 1.3) * 0.5 + Math.sin(y * 5.1 + z * 4.3 + x * 2.9) * 0.25;
}
function weldNormals(g) {            // removes the UV-sphere seam by averaging normals of coincident vertices
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, map = new Map(), key = i =>
    Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
  for (let i = 0; i < p.count; i++) {
    const k = key(i); let a = map.get(k);
    if (!a) { a = [0, 0, 0]; map.set(k, a); }
    a[0] += n.getX(i); a[1] += n.getY(i); a[2] += n.getZ(i);
  }
  for (let i = 0; i < p.count; i++) {
    const a = map.get(key(i)), l = Math.hypot(a[0], a[1], a[2]) || 1;
    n.setXYZ(i, a[0] / l, a[1] / l, a[2] / l);

}
function chamberGeo(o) {              // unit sphere → tapered, lumpy muscle shape with fat-tinted vertex colours
  const g = new THREE.SphereGeometry(1, 72, 52), p = g.attributes.position, v = new THREE.Vector3();
  const col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    if (o.apex && v.y < 0) { const k = 1 - o.apex * Math.pow(-v.y, 1.6); v.x *= k; v.z *= k; }
    const n = noise3(v.x * 1.6 + o.seed, v.y * 1.6, v.z * 1.6 + o.seed * 0.5);
    v.multiplyScalar(1 + n * o.bump);
    p.setXYZ(i, v.x, v.y, v.z);
    const f = sstep(0.25, 0.7, n), sh = 0.9 + 0.18 * n;
    col[i * 3] = sh; col[i * 3 + 1] = sh * lerp(1, 0.84, f * 0.55); col[i * 3 + 2] = sh * lerp(1, 0.62, f * 0.55);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  weldNormals(g);
  return g;
}
const shellMat = (color, opacity, clip) => new THREE.MeshPhysicalMaterial({
  color, vertexColors: true, roughness: 0.46, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.3,
  transparent: true, opacity, depthWrite: false, clippingPlanes: clip ? [clipPlane] : null,
  emissive: new THREE.Color(color).multiplyScalar(0.12) });
const liningMat = (color, clip) => new THREE.MeshStandardMaterial({

  const vent = sstep(0.17, 0.27, p) * (1 - sstep(0.38, 0.50, p));          // ventricular contraction

  const avOpen = 1 - sstep(0.15, 0.20, p) * (1 - sstep(0.55, 0.62, p));    // AV valves open (filling)

  // squeeze / twist of each chamber (non-uniform scale in its own tilted frame)
  const sv = 1 - 0.085 * vent + 0.012 * dub;
  LV.scale.set(sv, 1 - 0.05 * vent, sv);
  RV.scale.set(1 - 0.10 * vent + 0.012 * dub, 1 - 0.05 * vent, 1 - 0.10 * vent + 0.012 * dub);

  if (name !== lastName) { phaseName.textContent = name; lastName = name; }

}

function flyTo(v, dur) {
  gsap.killTweensOf(camera.position); gsap.killTweensOf(controls.target);
  gsap.to(controls.target, { x: v.t.x, y: v.t.y, z: v.t.z, duration: dur || 1.2, ease: 'power3.inOut' });
  gsap.to(camera.position, { x: v.p.x, y: v.p.y, z: v.p.z, duration: dur || 1.2, ease: 'power3.inOut' });
}
function spawn() {
  if (state !== 'scan') return;
  state = 'placed';
  anchor.position.set(reticleTarget.x, 0, reticleTarget.z);
  gsap.killTweensOf([heart.scale, heart.position, anchorRing.scale, reticle.scale]);
  heart.visible = true; heart.scale.setScalar(0.001); heart.position.y = 0.3;
  anchorRing.visible = true; anchorRing.scale.setScalar(0.01);
  aPulse.material.opacity = 0.9; aPulse.scale.setScalar(1);
  gsap.to(anchorRing.scale, { x: 1, y: 1, z: 1, duration: 0.9, ease: 'back.out(1.6)' });
  gsap.to(heart.scale, { x: 1, y: 1, z: 1, duration: 1.5, ease: 'elastic.out(1,0.55)', delay: 0.15 });
  gsap.to(heart.position, { y: HEART_Y, duration: 1.3, ease: 'power3.out', delay: 0.1 });
  gsap.to(reticle.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.4, onComplete: () => { reticle.visible = false; } });
  featurePts.visible = false;
  document.body.classList.add('placed'); setState('Anchored', true);
  flyTo(defaultView(), 1.7);
  hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 7500);
}
function toScan() {
  if (state !== 'placed') return;
  state = 'scan'; scanT = 0; scanFound = false;
  closeCard(); setCut(false, true);
  gsap.killTweensOf([heart.scale, heart.position]);
  gsap.to(heart.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.5, ease: 'power2.in', onComplete: () => { if (state === 'scan') heart.visible = false; } });
  anchorRing.visible = false; featurePts.visible = true;
  reticle.visible = true; gsap.killTweensOf(reticle.scale); reticle.scale.setScalar(1);
  reticle.position.set(anchor.position.x, 0.012, anchor.position.z); reticleTarget.set(anchor.position.x, 0, anchor.position.z);
  document.body.classList.remove('placed'); setState('Scanning', false);
  scanMsg.textContent = 'Move your device slowly to detect a surface…';
  const t = new THREE.Vector3(anchor.position.x, 0.3, anchor.position.z);
  flyTo({ t, p: t.clone().add(new THREE.Vector3(0, 2.4, 5.5)) }, 1.2);
}
function ensureFront() {
  const v = camera.position.clone().sub(controls.target);
  if (v.z < v.length() * 0.3) {
    const t = controls.target.clone();
    flyTo({ t, p: t.clone().add(new THREE.Vector3(0.3, 0.16, 1).normalize().multiplyScalar(Math.max(v.length(), 3.4))) }, 1.1);
  }
}
function setCut(on, instant) {
  cut.on = on; btnCut.setAttribute('aria-pressed', on ? 'true' : 'false');
  gsap.killTweensOf(cut); gsap.killTweensOf(innerLight);
  const z = on ? ON_Z : OFF_Z, li = on ? 0.55 : 0;
  if (instant) { cut.z = z; innerLight.intensity = li; }
  else {
    gsap.to(cut, { z, duration: 1.3, ease: 'power2.inOut' });
    gsap.to(innerLight, { intensity: li, duration: 1.0 });
    if (on) ensureFront();
  }
  if (!on && cardTag && cardTag.inside) closeCard();
}

$('btnSpawn').addEventListener('click', spawn);
$('btnAnchor').addEventListener('click', toScan);
btnCut.addEventListener('click', () => { if (state === 'placed') setCut(!cut.on); });
$('btnReset').addEventListener('click', () => { if (state !== 'placed') return; closeCard(); flyTo(defaultView(), 1.2); });
$('btnFlow').addEventListener('click', e => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); flow.visible = on;
});
$('btnTags').addEventListener('click', e => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); tagsOn = on; if (!on) closeCard();
});
const bpmIn = $('bpm'), bpmVal = $('bpmVal'), bpmZone = $('bpmZone');
function onBpm() {
  const v = +bpmIn.value; bpmTarget = v; bpmVal.textContent = v;
  bpmZone.textContent = v < 60 ? 'Slow / sleeping' : v <= 100 ? 'Resting' : v <= 140 ? 'Light exercise' : v <= 165 ? 'Hard exercise' : 'Near maximum';
  document.documentElement.style.setProperty('--dur', (60 / v).toFixed(3) + 's');
}
bpmIn.addEventListener('input', onBpm); onBpm();
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

/* tap on the canvas: place the heart (scan state) or dismiss the card; mouse hover moves the reticle */
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 7) return;
  if (state === 'scan') { const h = floorHit(e.clientX, e.clientY); if (h) setReticleTarget(h); spawn(); }
  else closeCard();
});
canvas.addEventListener('pointermove', e => {
  if (state === 'scan' && e.pointerType === 'mouse' && e.buttons === 0) { const h = floorHit(e.clientX, e.clientY); if (h) setReticleTarget(h); }
});

/* =====================================================================
   10. MAIN LOOP
   ===================================================================== */
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
  controls.update();
  clipPlane.constant = anchor.position.z + cut.z;
  if (state === 'scan') updateScan(dt); else updateHeart(dt);
  renderer.render(scene, camera);
  updateTags(); positionCard();
}
requestAnimationFrame(tick);

// tiny test hook (harmless in production): lets automated checks drive the demo
window.__anatomy = { camera, controls, spawn, toScan, setCut, openCard: id => openCard(TAGS.find(t => t.id === id)), get state() { return state; } };
})();
</script>

</template>

<script>
(function () {
  'use strict';
  var DEMOS = {
    dragon: { tpl: 'demo-dragon', title: 'Dragon World · AR VR MR' },
    heart:  { tpl: 'demo-heart',  title: 'Anatomy Explorer · AR Heart' }
  };
  var sel = document.getElementById('demo'), host = document.getElementById('host'), current = null;

  function load(key) {
    var d = DEMOS[key]; if (!d) return;
    current = key; sel.value = key;
    host.replaceChildren();                                   // unloading the old iframe stops its camera + WebGL
    var f = document.createElement('iframe');
    f.title = d.title;
    f.setAttribute('allow', 'camera; accelerometer; gyroscope; magnetometer; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.srcdoc = '<!DOCTYPE html><html lang="en">' + document.getElementById(d.tpl).innerHTML;
    host.appendChild(f);
    document.title = d.title + ' · XR Classroom Lab';
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    try { localStorage.setItem('xr-lab-demo', key); } catch (e) {}
  }

  sel.addEventListener('change', function () { load(sel.value); });
  window.addEventListener('hashchange', function () {
    var k = location.hash.slice(1); if (DEMOS[k] && k !== current) load(k);
  });

  var start = location.hash.slice(1);
  if (!DEMOS[start]) { try { start = localStorage.getItem('xr-lab-demo'); } catch (e) {} }
  load(DEMOS[start] ? start : 'dragon');
})();
</script>
