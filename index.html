<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<meta name="description" content="Classroom demo of Augmented Reality, Virtual Reality and Mixed Reality with a 3D dragon. Runs in the phone browser, no app needed.">
<title>AR · VR · MR Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐉%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b16;--fg:#fff;--accent:#ff6a2b;--cy:#37e6ff;--panel:rgba(15,15,28,.74)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#bgFB{position:absolute;inset:0;background:linear-gradient(#34507a,#6f8f7a 55%,#3e5a35);display:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#tabs{display:flex;gap:6px;pointer-events:auto}
.tab{flex:1;font-size:13px;padding:10px 4px;line-height:1.2}
.tab small{display:block;font-weight:500;font-size:10px;opacity:.8}
.tab.on{background:var(--cy);color:#00222a;border-color:var(--cy)}
#cap{font-size:13px;line-height:1.35;background:var(--panel);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
button{font:inherit;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 16px;backdrop-filter:blur(6px);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#1a0b00}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:none;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
#push{font-size:18px;padding:16px 26px;background:#e53030;border-color:#ff8a8a;box-shadow:0 0 24px #e53030aa}
#flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .35s;pointer-events:none;z-index:30}
#rim{position:absolute;inset:0;pointer-events:none;display:none;z-index:6;border:10px solid rgba(40,50,60,.9);border-radius:46px;margin:calc(110px + env(safe-area-inset-top,0px)) 10px 70px;box-shadow:inset 0 0 90px 40px rgba(0,10,20,.85)}
#rim.on{border-color:rgba(55,230,255,.85);box-shadow:inset 0 0 70px 20px rgba(0,60,80,.7),0 0 0 2000px rgba(0,0,0,.5)}
#lab{position:absolute;z-index:7;display:none;transform:translate(-50%,-130%);font-size:12px;font-weight:700;color:#002a33;background:var(--cy);padding:4px 8px;border-radius:10px;pointer-events:none;white-space:nowrap}
.msg{width:100%;text-align:center;font-size:12px;color:#ffb27a;min-height:1em}
#start{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:170px 24px 24px;background:rgba(8,8,16,.88)}
#start h1{margin:0;font-size:28px}
#start p{margin:0;max-width:340px;line-height:1.45;opacity:.85}
#start .note{font-size:12px;opacity:.6}
#start button{font-size:18px;padding:14px 28px}
#err{font-size:13px;color:#ffb27a;min-height:1em}
</style>
</head>
<body>
<div id="bgFB"></div>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<div id="rim"></div>
<div id="lab">🐉 Virtual dragon</div>

<div id="top">
  <div id="tabs">
    <button class="tab on" id="tA">AR<small>Augmented</small></button>
    <button class="tab" id="tV">VR<small>Virtual</small></button>
    <button class="tab" id="tM">MR<small>Mixed</small></button>
  </div>
  <div id="cap"></div>
</div>

<div id="start">
  <h1>🐉 AR Dragon</h1>
  <p>Point your phone at a room. The camera shows the real world and a 3D dragon is added on top of it.</p>
  <button id="go" class="main">Start AR</button>
  <div id="err"></div>
  <div class="note">Allow camera and motion access when asked. On a laptop there is no gyroscope: drag the mouse to look around.</div>
</div>

<div class="bar" id="barA">
  <button id="fireA" class="main">🔥 Breathe fire</button>
  <button id="big">＋</button>
  <button id="small">－</button>
  <div class="msg" id="msgA"></div>
</div>

<div class="bar" id="barV">
  <button id="push">🔴 PUSH THE BUTTON</button>
  <button id="back" style="display:none">↩ Back to VR lobby</button>
</div>

<div class="bar" id="barM">
  <button id="glasses" class="main">👓 MR glasses: ON</button>
  <button id="eye">👁 Avatar eyes</button>
  <button id="fireM">🔥 Fire</button>
  <button id="camBtn">📷 Real camera</button>
  <div class="msg" id="msg"></div>
</div>

<div id="flash"></div>
<noscript>This demo needs JavaScript.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('gl'),renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
var T=0,mode='A',arStarted=false,camOn=false,stream=null;

/* ---------- helpers ---------- */
function mat(c,o){var m=new THREE.MeshStandardMaterial({color:c,roughness:.7});if(o!=null){m.transparent=true;m.opacity=o;}return m;}
function bas(c,o){var m=new THREE.MeshBasicMaterial({color:c});if(o!=null){m.transparent=true;m.opacity=o;}return m;}
function put(o,x,y,z){o.position.set(x||0,y||0,z||0);return o;}
function S(r,m,x,y,z,sx,sy,sz){var o=put(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m),x,y,z);o.scale.set(sx||1,sy||1,sz||1);return o;}
function X(w,h,d,m,x,y,z){return put(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),x,y,z);}
function C(rt,rb,h,m,x,y,z,n){return put(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n||10),m),x,y,z);}
function K(r,h,m,x,y,z,n){return put(new THREE.Mesh(new THREE.ConeGeometry(r,h,n||8),m),x,y,z);}
function lights(sc){sc.add(new THREE.HemisphereLight(0xffffff,0x665544,.95));var d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(4,8,5);sc.add(d);}

/* ---------- dragon (built from simple shapes) ---------- */
function makeDragon(){
  var red=mat(0xb3261e),dark=mat(0x6e1410),belly=mat(0xe8b25a),bone=mat(0xf2e6c9),eyeM=bas(0xffe14d),wingM=mat(0x8c1c15);wingM.side=THREE.DoubleSide;
  var g=new THREE.Group(),rig=new THREE.Group();g.add(rig);
  rig.add(S(.5,red,0,.55,0,1,.9,1.8));rig.add(S(.42,belly,0,.42,.05,.9,.7,1.7));
  var neck=[];for(var i=0;i<5;i++){var n=S(.2-i*.012,red,0,.75+i*.1,.8+i*.12);rig.add(n);neck.push(n);}
  var head=new THREE.Group();put(head,0,1.28,1.45);rig.add(head);
  head.add(S(.2,red,0,0,0,1,.9,1.3));head.add(S(.13,red,0,-.04,.3,1,.8,1.5));
  head.add(S(.05,eyeM,.12,.08,.12));head.add(S(.05,eyeM,-.12,.08,.12));
  [-1,1].forEach(function(s){var h=K(.05,.3,bone,s*.1,.22,-.08,8);h.rotation.x=-.6;head.add(h);});
  var mouth=put(new THREE.Object3D(),0,-.05,.55);head.add(mouth);
  for(var k=0;k<7;k++)rig.add(K(.05,.16,bone,0,1.0-k*.02,.55-k*.28,6));
  [[.28,.9],[-.28,.9],[.28,-.7],[-.28,-.7]].forEach(function(p){rig.add(C(.09,.07,.4,dark,p[0],.2,p[1],8));rig.add(S(.11,dark,p[0],.02,p[1]+.05,1,.6,1.4));});
  var tail=[];for(var t=0;t<11;t++){var ts=S(.3-t*.024,red,0,.5,-.9-t*.3);rig.add(ts);tail.push(ts);}
  function wing(side){
    var w=put(new THREE.Group(),side*.35,.95,.15);
    var v=[0,0,0,1.5,.55,-.1,2.4,.15,-.6,2.0,-.25,-1.1,1.0,-.15,-1.0,0,0,-.8],pos=v.slice();
    if(side<0)for(var q=0;q<pos.length;q+=3)pos[q]*=-1;
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex([0,1,2,0,2,3,0,3,4,0,4,5]);geo.computeVertexNormals();
    w.add(new THREE.Mesh(geo,wingM));
    var arm=C(.03,.04,2.4,dark,side*1.2,.2,-.1,6);arm.rotation.z=-side*Math.PI/2+side*.22;w.add(arm);return w;}
  var wl=wing(-1),wr=wing(1);rig.add(wl);rig.add(wr);
  return {g:g,rig:rig,wl:wl,wr:wr,tail:tail,neck:neck,head:head,mouth:mouth};
}
function animD(d,T,f,amp){
  d.wl.rotation.z=-Math.sin(T*f)*amp;d.wr.rotation.z=Math.sin(T*f)*amp;
  d.tail.forEach(function(s,i){s.position.x=Math.sin(T*2.2-i*.55)*.05*(i+1);});
  d.head.rotation.y=Math.sin(T*.9)*.25;d.head.rotation.x=Math.sin(T*1.3)*.06;
}

/* ---------- fire particles ---------- */
function Fire(parent,scale){
  this.t=0;this.i=0;this.s=scale||1;this.p=[];
  var g=new THREE.SphereGeometry(.06,6,5);
  for(var n=0;n<90;n++){var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffcc33,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.visible=false;m.userData={l:0,v:new THREE.Vector3()};parent.add(m);this.p.push(m);}
}
Fire.prototype.start=function(){this.t=1.4;};
Fire.prototype.update=function(dt,d){
  var self=this,tmp=new THREE.Vector3(),dir=new THREE.Vector3();
  if(this.t>0){this.t-=dt;d.g.updateMatrixWorld(true);
    for(var s=0;s<2;s++){var m=this.p[this.i=(this.i+1)%this.p.length];m.parent.worldToLocal(d.mouth.getWorldPosition(m.position));
      dir.set(0,-.12,1).transformDirection(d.head.matrixWorld);
      m.userData.v.copy(dir).multiplyScalar((2.2+Math.random()*1.2)*self.s).add(tmp.set(Math.random()-.5,Math.random()-.4,Math.random()-.5).multiplyScalar(.7*self.s));
      m.userData.l=.9;m.visible=true;}}
  this.p.forEach(function(m){if(!m.visible)return;var u=m.userData;u.l-=dt;if(u.l<=0){m.visible=false;return;}
    m.position.addScaledVector(u.v,dt);u.v.y+=.6*dt;m.scale.setScalar((1+(.9-u.l)*3.2)*self.s);
    m.material.color.setHSL(.02+.1*(u.l/.9),1,.5);m.material.opacity=u.l/.9;});
};

/* ---------- avatar (VR headset or MR glasses) ---------- */
function makeAvatar(kind){
  var skin=mat(0xf0c8a0),shirt=mat(0x1f8a9e),pants=mat(0x2b2f4a),hair=mat(0x2a1a10),g=new THREE.Group();
  g.add(X(.5,.7,.28,shirt,0,1.05,0));
  var head=put(new THREE.Group(),0,1.6,0);g.add(head);head.add(S(.18,skin,0,0,0));head.add(S(.19,hair,0,.04,-.03,1,.8,1));
  function limb(w,h,d,m,x,y){var p=put(new THREE.Group(),x,y,0);p.add(X(w,h,d,m,0,-h/2,0));g.add(p);return p;}
  var legL=limb(.17,.7,.2,pants,-.12,.7),legR=limb(.17,.7,.2,pants,.12,.7),armL=limb(.14,.6,.16,skin,-.33,1.38),armR=limb(.14,.6,.16,skin,.33,1.38);
  var lens=null;
  if(kind==='vr'){
    head.add(X(.42,.22,.26,mat(0x15151f),0,.02,.1));
    head.add(X(.34,.07,.02,bas(0x37e6ff),0,.02,.235));
    var st=new THREE.Mesh(new THREE.TorusGeometry(.2,.02,6,18),mat(0x15151f));st.rotation.x=Math.PI/2;st.position.y=.03;head.add(st);
  }else{
    var fm=mat(0x222a33);lens=new THREE.MeshBasicMaterial({color:0x37e6ff,transparent:true,opacity:.5,side:THREE.DoubleSide});
    [-1,1].forEach(function(s){head.add(put(new THREE.Mesh(new THREE.TorusGeometry(.058,.009,6,18),fm),s*.075,.03,.172));
      head.add(put(new THREE.Mesh(new THREE.CircleGeometry(.056,18),lens),s*.075,.03,.172));
      head.add(X(.01,.01,.18,fm,s*.16,.03,.08));});
    head.add(X(.05,.01,.01,fm,0,.04,.172));
  }
  g.userData={legL:legL,legR:legR,armL:armL,armR:armR,lens:lens,head:head};return g;
}
function walk(a,t,on){var u=a.userData,s=on?Math.sin(t*10)*.7:0;u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s;u.armR.rotation.x=s;}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}

/* ====================== AR : camera + dragon added ====================== */
var AR=new THREE.Scene(),camAR=new THREE.PerspectiveCamera(60,1,.05,50);lights(AR);
var HGT=1.4; /* assumed phone height above the floor, metres */
var drA=makeDragon(),dragA=drA.g;
var shadowA=new THREE.Mesh(new THREE.CircleGeometry(1.3,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));
shadowA.rotation.x=-Math.PI/2;shadowA.position.y=.01;shadowA.scale.set(1,1.6,1);dragA.add(shadowA);
var baseA=.7;dragA.scale.setScalar(baseA);dragA.visible=false;AR.add(dragA);
var fireAR=new Fire(AR,.7),placedA=false,arStartT=-1;
var D2R=Math.PI/180,zee=new THREE.Vector3(0,0,1),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),eu=new THREE.Euler();
var gotO=false,oriBound=false,yawA=0,pitchA=0,fwdA=new THREE.Vector3();
function onOri(e){if(e.alpha==null)return;gotO=true;
  var o=(screen.orientation&&screen.orientation.angle||window.orientation||0)*D2R;
  eu.set(e.beta*D2R,e.alpha*D2R,-e.gamma*D2R,'YXZ');camAR.quaternion.setFromEuler(eu);
  camAR.quaternion.multiply(q1);camAR.quaternion.multiply(q0.setFromAxisAngle(zee,-o));}
function bindOri(){
  if(oriBound)return null;
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    return DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted'){addEventListener('deviceorientation',onOri,true);oriBound=true;}}).catch(function(){});
  }
  addEventListener('deviceorientation',onOri,true);oriBound=true;return null;
}
function placeA(x,z){dragA.position.set(x,-HGT,z);dragA.visible=true;placedA=true;}
function placeAhead(){camAR.getWorldDirection(fwdA);fwdA.y=0;if(fwdA.lengthSq()<1e-4)fwdA.set(0,0,-1);fwdA.normalize();placeA(fwdA.x*3,fwdA.z*3);}
function sizeA(f){baseA=Math.max(.3,Math.min(2.2,baseA*f));dragA.scale.setScalar(baseA);fireAR.s=baseA;}
function updAR(dt,t){
  if(!gotO)camAR.rotation.set(pitchA,yawA,0,'YXZ');
  if(!placedA&&arStarted&&arStartT>=0&&(gotO||t-arStartT>1.2)){if(gotO)placeAhead();else placeA(0,-3);}
  if(placedA){
    dragA.lookAt(camAR.position.x,dragA.position.y,camAR.position.z);
    drA.rig.position.y=Math.sin(t*2)*.03;animD(drA,t,3.2,.5);
  }
  fireAR.update(dt,drA);
}
$('fireA').onclick=function(){fireAR.start();};
$('big').onclick=function(){sizeA(1.2);};
$('small').onclick=function(){sizeA(1/1.2);};

/* ---------- shared camera ---------- */
function startCam(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return Promise.reject(new Error('no camera api'));
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){stream=s;$('cam').srcObject=s;camOn=true;});
}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}$('cam').srcObject=null;camOn=false;}
var CAMERR='Camera blocked or unavailable, so a plain background is shown. Open this page directly in your phone browser (https) and allow the camera.';
$('go').onclick=function(){
  $('err').textContent='';$('msgA').textContent='';
  var tasks=[];
  tasks.push(startCam().catch(function(){$('msgA').textContent=CAMERR;}));
  tasks.push(bindOri());
  Promise.all(tasks).then(function(){arStarted=true;arStartT=T;layout();});
};

/* ====================== VR : headset avatar + button -> Dragon Island ====================== */
var VR=new THREE.Scene(),camVR=new THREE.PerspectiveCamera(60,1,.05,300);lights(VR);
var lobby=new THREE.Group(),island=new THREE.Group();VR.add(lobby);VR.add(island);island.visible=false;
var lobbyFloor=new THREE.Mesh(new THREE.CircleGeometry(9,48),mat(0x0f1230));lobbyFloor.rotation.x=-Math.PI/2;lobby.add(lobbyFloor);
var grid=new THREE.GridHelper(18,18,0x37e6ff,0x24306a);grid.position.y=.01;lobby.add(grid);
var edge=new THREE.Mesh(new THREE.TorusGeometry(9,.06,6,64),bas(0x37e6ff));edge.rotation.x=Math.PI/2;lobby.add(edge);
var holo=[];for(var hi=0;hi<7;hi++){var hb=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),new THREE.MeshBasicMaterial({color:0x37e6ff,wireframe:true}));put(hb,Math.sin(hi*1.9)*6,2+hi%3,-4-hi%4);lobby.add(hb);holo.push(hb);}
lobby.add(C(.5,.6,.9,mat(0x2b2f4a),1.4,.45,-1.4,20));
lobby.add(C(.45,.5,.15,mat(0x555a78),1.4,.97,-1.4,20));
var btn=C(.3,.3,.18,new THREE.MeshStandardMaterial({color:0xe53030,emissive:0xaa1010,roughness:.4}),1.4,1.13,-1.4,24);lobby.add(btn);
var portal=new THREE.Group();put(portal,4.8,1.4,0);portal.rotation.y=Math.PI/2;portal.scale.setScalar(.001);
portal.add(new THREE.Mesh(new THREE.TorusGeometry(1.3,.1,10,40),bas(0xff6af0)));
var disc=new THREE.Mesh(new THREE.CircleGeometry(1.25,32),new THREE.MeshBasicMaterial({color:0x8a5cff,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));portal.add(disc);lobby.add(portal);
var avV=makeAvatar('vr');VR.add(avV);
/* island */
var sea=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x2a8fd0,.95));sea.rotation.x=-Math.PI/2;sea.position.y=.15;island.add(sea);
island.add(C(8,11,1.4,mat(0xe8d49a),0,.5,0,40));
island.add(C(7.2,7.4,.12,mat(0x5fae4a),0,1.24,0,40));
island.add(K(4.2,6.5,mat(0x5a3a30),0,4.4,-1.5,16));
island.add(S(.9,new THREE.MeshBasicMaterial({color:0xff7a1a}),0,7.7,-1.5,1,.5,1));
for(var pm=0;pm<9;pm++){var pa=pm/9*Math.PI*2+.3,px=Math.sin(pa)*5.6,pz=Math.cos(pa)*5.6-1;if(pz>3&&Math.abs(px)<3.5)continue;
  var pg=new THREE.Group();put(pg,px,1.3,pz);pg.add(C(.12,.18,2.6,mat(0x8a5a2b),0,1.3,0,6));
  for(var lf=0;lf<5;lf++){var la=lf/5*Math.PI*2,leaf=S(.6,mat(0x2f9a3a),Math.cos(la)*.55,2.6,Math.sin(la)*.55,1,.12,.35);leaf.rotation.y=-la;pg.add(leaf);}
  island.add(pg);}
for(var rk=0;rk<5;rk++){var rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+rk*.12),mat(0x777777));put(rock,Math.sin(rk*2.3)*6.2,1.3,Math.cos(rk*2.3)*6-1);island.add(rock);}
var drV=makeDragon();drV.g.scale.setScalar(1.3);island.add(drV.g);
var fireV=new Fire(island,1.3),fireVt=3;
var V={phase:'lobby',pt:0,yaw:0},lookT=new THREE.Vector3(),orb=new THREE.Vector3();
function resetV(){V.phase='lobby';V.pt=0;lobby.visible=true;island.visible=false;VR.background=new THREE.Color(0x07071a);VR.fog=null;
  avV.position.set(-1.5,0,0);avV.rotation.y=Math.PI/2;avV.scale.setScalar(1);portal.scale.setScalar(.001);btn.scale.y=1;btn.position.y=1.13;
  $('flash').style.opacity=0;$('push').style.display='';$('back').style.display='none';if(mode==='V')capV();}
function pushButton(){if(V.phase!=='lobby')return;V.phase='press';V.pt=0;$('push').style.display='none';}
$('push').onclick=pushButton;$('back').onclick=resetV;
function updV(dt,t){
  V.pt+=dt;var ph=V.phase;
  holo.forEach(function(b){b.rotation.x+=dt*.4;b.rotation.y+=dt*.6;});
  disc.rotation.z+=dt*2;
  if(ph==='lobby'){avV.position.y=Math.sin(t*2)*.01;walk(avV,t,false);camVR.position.set(1,2.4,7.5);camVR.lookAt(1.3,1.1,0);}
  if(ph==='press'){var k=Math.min(V.pt/.2,1);btn.scale.y=1-.6*k;btn.position.y=1.13-.07*k;portal.scale.setScalar(.001+ease((V.pt-.3)/.9));
    camVR.position.set(1,2.4,7.5);camVR.lookAt(1.3,1.1,0);if(V.pt>1.2){V.phase='walk';V.pt=0;}}
  if(ph==='walk'){var p=Math.min(V.pt/2.4,1);avV.position.x=-1.5+6.1*p;walk(avV,t,true);
    camVR.position.set(1+avV.position.x*.3,2.4,7.5);camVR.lookAt(avV.position.x*.5+.8,1.2,0);
    if(p>.85)avV.scale.setScalar(Math.max(.05,1-(p-.85)/.15));
    if(p>=1){V.phase='flash';V.pt=0;$('flash').style.opacity=1;}}
  if(ph==='flash'&&V.pt>.4){lobby.visible=false;island.visible=true;VR.background=new THREE.Color(0x9bd7ff);VR.fog=new THREE.Fog(0x9bd7ff,45,160);
    avV.scale.setScalar(1);avV.position.set(0,1.3,7);avV.rotation.y=Math.PI;camVR.position.set(0,9,34);V.phase='island';V.pt=0;$('flash').style.opacity=0;$('back').style.display='';capV();}
  if(V.phase==='island'){
    var a=t*.4;drV.g.position.set(Math.cos(a)*12,9+Math.sin(t*1.5)*.6,-1.5+Math.sin(a)*12);
    drV.g.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a));drV.g.rotation.z=-.15;
    animD(drV,t,5,.7);
    fireVt-=dt;if(fireVt<0){fireV.start();fireVt=6;}
    fireV.update(dt,drV);
    avV.position.y=1.3+Math.sin(t*2)*.01;walk(avV,t,false);avV.userData.armR.rotation.x=-2.7+Math.sin(t*6)*.3;
    orb.set(Math.sin(V.yaw)*15,3.6,-1.5+Math.cos(V.yaw)*15);
    camVR.position.lerp(orb,1-Math.pow(.002,dt));lookT.set(0,5,-1.5);camVR.lookAt(lookT);}
}

/* ====================== MR : see-through park + glasses ====================== */
var MR=new THREE.Scene(),camMR=new THREE.PerspectiveCamera(60,1,.05,200);lights(MR);
var park=new THREE.Group();MR.add(park);
var gr=new THREE.Mesh(new THREE.CircleGeometry(9,40),mat(0x4caf50,.55));gr.rotation.x=-Math.PI/2;park.add(gr);
var pathM=new THREE.Mesh(new THREE.PlaneGeometry(1.6,16),mat(0xd8d2c0,.8));pathM.rotation.x=-Math.PI/2;pathM.position.set(0,.02,0);park.add(pathM);
var pond=new THREE.Mesh(new THREE.CircleGeometry(1.8,28),mat(0x2a8fd0,.7));pond.rotation.x=-Math.PI/2;pond.position.set(4,.03,2.5);park.add(pond);
[[-4,-3],[-5.5,1.5],[4.5,-4.5],[6,-1],[-3,5],[2,6.2],[-6.5,-4]].forEach(function(tr,i){var s=.9+(i%3)*.25;
  park.add(C(.14*s,.2*s,1.6*s,mat(0x7a5230,.9),tr[0],.8*s,tr[1],7));park.add(K(.9*s,1.8*s,mat(0x2e8b3a,.85),tr[0],2.3*s,tr[1],8));park.add(K(.7*s,1.4*s,mat(0x35a043,.85),tr[0],3.2*s,tr[1],8));});
park.add(X(1.6,.12,.5,mat(0x8a5a2b,.9),-2.6,.5,1.6));park.add(X(1.6,.5,.08,mat(0x8a5a2b,.9),-2.6,.8,1.38));park.add(X(.1,.5,.4,mat(0x333333,.9),-3.3,.25,1.6));park.add(X(.1,.5,.4,mat(0x333333,.9),-1.9,.25,1.6));
park.add(C(.05,.06,2.6,mat(0x333333,.9),2.8,1.3,.8,6));park.add(S(.2,new THREE.MeshBasicMaterial({color:0xffe9a0}),2.8,2.7,.8));
var drM=makeDragon();put(drM.g,2.2,0,-3.2);drM.g.scale.setScalar(.85);park.add(drM.g);drM.g.lookAt(-1.2,0,-.5);
var holoRing=new THREE.Mesh(new THREE.RingGeometry(1.6,1.75,40),new THREE.MeshBasicMaterial({color:0x37e6ff,transparent:true,opacity:.8,side:THREE.DoubleSide}));holoRing.rotation.x=-Math.PI/2;put(holoRing,2.2,.04,-3.2);park.add(holoRing);
var fireM=new Fire(park,.85);
var avM=makeAvatar('mr');put(avM,-1.2,0,-.5);avM.rotation.y=Math.atan2(2.2+1.2,-3.2+.5);MR.add(avM);
var M={glasses:true,eye:false,yaw:.4},vecM=new THREE.Vector3();
$('glasses').onclick=function(){M.glasses=!M.glasses;$('glasses').textContent='👓 MR glasses: '+(M.glasses?'ON':'OFF');$('glasses').className=M.glasses?'main':'';capM();};
$('eye').onclick=function(){M.eye=!M.eye;$('eye').textContent=M.eye?'🎥 Orbit view':'👁 Avatar eyes';};
$('fireM').onclick=function(){if(M.glasses)fireM.start();};
$('camBtn').onclick=function(){
  if(camOn){stopCam();layout();return;}
  startCam().then(function(){$('msg').textContent='';layout();}).catch(function(){$('msg').textContent=CAMERR;});
};
function updM(dt,t){
  park.visible=M.glasses;holoRing.material.opacity=.5+Math.sin(t*3)*.3;
  avM.userData.lens.opacity=M.glasses?.55:.12;avM.position.y=Math.sin(t*2)*.01;walk(avM,t,false);
  drM.rig.position.y=Math.sin(t*2)*.03;animD(drM,t,2.5,.25);fireM.update(dt,drM);
  if(M.eye){avM.userData.head.visible=false;camMR.fov=78;camMR.position.set(-1.2,1.62,-.5);camMR.updateProjectionMatrix();
    drM.head.getWorldPosition(vecM);camMR.lookAt(vecM.x,vecM.y*.6+.5,vecM.z);}
  else{avM.userData.head.visible=true;if(camMR.fov!==60){camMR.fov=60;camMR.updateProjectionMatrix();}
    camMR.position.set(Math.sin(M.yaw)*8,2.8,Math.cos(M.yaw)*8);camMR.lookAt(.5,1,-1);}
  $('rim').style.display=M.eye?'block':'none';$('rim').className=M.glasses?'on':'';
  drM.head.getWorldPosition(vecM);vecM.project(camMR);var lab=$('lab');
  if(M.glasses&&vecM.z<1){lab.style.display='block';lab.style.left=((vecM.x+1)/2*innerWidth)+'px';lab.style.top=((1-vecM.y)/2*innerHeight)+'px';}else lab.style.display='none';
}

/* ====================== tabs, captions, layout ====================== */
function capA(){$('cap').textContent='AR = the real world with a virtual dragon added. The camera shows your real room and the dragon is drawn on top. Move the phone and it stays put. Tap the floor to move it.';}
function capV(){$('cap').textContent=V.phase==='island'?'VR = everything is virtual. The headset blocks the real world, so the ocean, volcano and dragon are all digital. Drag to look around.':'VR = fully virtual. The avatar wears a VR headset. Press the red button to open a portal to Dragon Island.';}
function capM(){$('cap').textContent=M.glasses?'MR = real world + virtual layer. The avatar looks THROUGH clear glasses: the real world stays visible and the park and dragon are added into it.':'Glasses OFF: only the real world is visible. The park and dragon are digital, so they vanish without the glasses.';}
function layout(){
  var A=mode==='A',Vm=mode==='V',Mm=mode==='M',live=(A&&arStarted)||Mm;
  $('barA').style.display=(A&&arStarted)?'flex':'none';
  $('barV').style.display=Vm?'flex':'none';
  $('barM').style.display=Mm?'flex':'none';
  $('start').style.display=(A&&!arStarted)?'flex':'none';
  $('cam').style.display=(live&&camOn)?'block':'none';
  $('bgFB').style.display=(live&&!camOn)?'block':'none';
  $('camBtn').textContent=camOn?'📷 Camera ON':'📷 Real camera';
  if(!Mm){$('rim').style.display='none';$('lab').style.display='none';}
}
function setMode(m){
  mode=m;
  ['A','V','M'].forEach(function(k){$('t'+k).className='tab'+(m===k?' on':'');});
  if(m==='V'){stopCam();arStarted=false;}
  if(m==='A'&&!camOn)arStarted=false;
  layout();
  if(m==='A')capA();else if(m==='V')capV();else capM();
}
$('tA').onclick=function(){setMode('A');};
$('tV').onclick=function(){setMode('V');};
$('tM').onclick=function(){setMode('M');};

/* ====================== input + loop ====================== */
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);[camAR,camVR,camMR].forEach(function(c){c.aspect=w/h;c.updateProjectionMatrix();});}
addEventListener('resize',resize);resize();
var drag=null,ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),HGT),hit=new THREE.Vector3();
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,m:0};});
addEventListener('pointermove',function(e){if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.m+=Math.abs(dx)+Math.abs(dy);
  if(mode==='A'&&!gotO){yawA+=dx*.005;pitchA=Math.max(-1.2,Math.min(1.2,pitchA+dy*.005));}
  if(mode==='V'&&V.phase==='island')V.yaw-=dx*.006;
  if(mode==='M'&&!M.eye)M.yaw-=dx*.006;});
addEventListener('pointerup',function(e){
  if(!drag)return;var tap=drag.m<6&&e.target===cv;drag=null;if(!tap)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  if(mode==='A'&&arStarted){ray.setFromCamera(ndc,camAR);if(ray.ray.intersectPlane(plane,hit)&&hit.distanceTo(camAR.position)<12)placeA(hit.x,hit.z);}
  else if(mode==='V'&&V.phase==='lobby'){ray.setFromCamera(ndc,camVR);if(ray.intersectObject(btn).length)pushButton();}
});
var clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);T+=dt;
  if(mode==='A'){updAR(dt,T);renderer.render(AR,camAR);}
  else if(mode==='V'){updV(dt,T);renderer.render(VR,camVR);}
  else{updM(dt,T);renderer.render(MR,camMR);}}
resetV();setMode('A');loop();
})();
</script>
